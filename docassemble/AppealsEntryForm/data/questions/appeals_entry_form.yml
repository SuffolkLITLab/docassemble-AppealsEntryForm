---
id: Appeals_entry_form
continue button field: appeals_entry_form_intro
question: |
  Civil Appeal Entry Form
subquestion: |
  This interview will help you create the Civil Appeal Entry Form. This form is only for civil appeals and is used to docket a civil appeal under Mass. R. A. P. 10(a).

  Before you start, gather:

  1. The name of the trial court you are appealing from
  2. Your trial court docket number (from your court paperwork)
  3. The case name as it appears on the Notice of Assembly
  4. Your Notice of Assembly from the trial court

  After you finish, you will need to:

  1. Submit a PDF of the form on eFileMA.com
  2. Make sure the form and any required fee or fee-waiver motion (with an Affidavit of Indigency) are received **within 14 days** after you get the Notice of Assembly. See Mass. R. A. P. 10(a)(1).
  3. Serve a copy of the form on all other parties.

  Learn more about the appeals process:

  * [Entering the appeal (civil)](https://www.mass.gov/info-details/entering-the-appeal-civil)
  * [Appeals Court frequently asked questions](https://www.mass.gov/guides/appeals-court-frequent-appellate-process-questions)

  Most people take about 10 minutes to complete this interview.

---
id: right form
question: |
  To use this form, you must have received a {Notice of Assembly}. 
fields: 
  - Have you received a Notice of Assembly?: received_notice_of_assembly
    datatype: yesnoradio
terms: 
  Notice of Assembly: |
    A notice of assembly is a formal notice that signals the record of the case (the pleadings, exhibit list, and other papers from the Trial Court) have been collected and sent to the appellate court.


---
event: kick_out_cannot_use
id: kickout 
question: |
  This is not the right form for you
subquestion: |
  % if not received_notice_of_assembly:
   In order to use this form, you must have received a Notice of Assembly from the court. If you have not, your case is not ready to be entered in the Appeals Court. You may call the lower court to check on the status of the notice of assembly. 
  
  
  % endif

---
id: who_is_filling_out_form
question: |
  Who is filling out this form?
subquestion: |
  Are you an attorney filling this form out on behalf of your client or are you filling this form out on behalf of yourself? 

fields:
  - I am: filer_role
    datatype: radio
    choices:
      - An attorney representing my client: attorney
      - Filling this out for myself: pro_se
---
id: What is the client's name
question: |
  What is your client's name?
subquestion: |
  Enter the name of your client in this appeal.
fields:
  - "Client name": appellant_name
show if: filer_role == 'attorney'
---
id: What is the case name
question: |
  What is the case name?
subquestion: |
  Please type the name of the case as it appears on your Notice of Assembly (ex. Jane v. Doe)
fields:
  - "Case name": case_name
---
id: docket_num 
question: | 
  What is the docket number for your case? 
subquestion: |
  You can search for the trial court docket number [here](https://www.masscourts.org/eservices/home.page.2) 
fields:
  - "Docket Number": docket_num

---
id: trial_court 
question: | 
  Select the Trial Court department and division where your case was heard.
fields:
  - no label: trial_court
    datatype: object
    choices: all_courts
---
id: Fee information
question: |
  Filing Fee Information
subquestion: |
  You will need to pay a fee or request a fee waiver to file the Civil Appeal Entry Form.  
fields:
  - "I want to:": filing_fee_option
    datatype: radio 
    choices: 
      - Request a fee waiver: waiver
      - Pay the $300 filing fee: pay 
terms: 
  appellant: |
    An appellant is the person who is appealing a decision—the one who lost in the lower court and is now asking a higher court to review or change that decision.
---
id: appellant_is_commonwealth
question: |
  Is the appellant the Commonwealth of Massachusetts?
fields:
  - no label: appellant_is_commonwealth
    datatype: yesnoradio
---
id: Date notice of assembly was received
question: |
  When did you receive the {notice of assembly}?
fields:
  - "Date Notice of assembly received": notice_of_assembly_received_date
    datatype: date
terms: 
  notice of assembly: |
    A notice of assembly is a formal notice that signals the record of the case (the pleadings, exhibit list, and other papers from the Trial Court) have been collected and sent to the appellate court.
---
id: certificate_of_service
question: |
  Information on the certificate of service
subquestion: |
  You must send all papers you file in the Appeals Court (except an affidavit of indigency) to all other parties or their attorneys.

  By checking the box below, you certify that you will serve a copy of the Civil Appeal Entry Form on all other parties or their attorneys. You can serve through the e-filing system or by other approved methods. If you have a restraining order, you may not be able to mail filings to the other party.
fields:
  - I certify that upon submittal, I have served all parties who are registered for electronic service through the electronic filing system and will serve all other parties conventionally.: certificate_of_service
    datatype: yesno
validation code: |
  if not certificate_of_service:
      validation_error("You must certify that you will serve all other parties to continue.")
---
id: preview appeals_entry_form
question: |
  Preview your form before you sign it
subquestion: |
  Here is a preview of the form you will sign on the next page.   
  
  ${ al_court_bundle.as_pdf(key='preview') }

  Click the image to open it in a new tab. Click the "Edit answers" button
  to edit your answers.

  ${ action_button_html(url_action('review_appeals_entry_form'), label='Edit answers', color='info') }
  
  Remember to come back to this window to continue and sign your form.
continue button field: appeals_entry_form_preview_question    
---
code: |
  signature_fields = []
---
code: |
  # This is a placeholder for the addresses that will be searched
  # for matching address to court. Edit if court venue is based on 
  # a different address than the user's
  [user.address.address for user in users.complete_elements()]
  addresses_to_search = [user.address for user in users.complete_elements()]
---
id: appeals entry form review screen
event: review_appeals_entry_form
question: |
  Review your answers
review:
  - Edit: appellant_is_commonwealth
    button: |
      **Appellant is the Commonwealth**:
      ${ word(yesno(appellant_is_commonwealth)) }
  - Edit: appellant_name
    button: |
      **Appellant name**:
      ${ appellant_name }
  - Edit: users.revisit
    button: |
      **Users**

      % for item in users:
        * ${ item }
      % endfor
  - Edit: trial_court
    button: |
      **Trial court**
  
      % if defined("trial_court.name.first"):
      * name: ${ trial_court.name.full() }
      % endif
  - Edit: notice_of_assembly_received_date
    button: |
      **Date of Notice of assembly received**:
      ${ notice_of_assembly_received_date }
  - Edit: case_name
    button: |
      **Case name**:
      ${ case_name }
 # - Edit: fee_waiver_requested
   # button: |
    #  **Fee waiver requested**:
    #  ${ word(yesno(fee_waiver_requested)) }
 # - Edit: paying_fee
  #  button: |
   #   **Paying fee**:
    #  ${ word(yesno(paying_fee)) }
  - Edit: docket_num
    button: |
      **Docket number**:
      ${ docket_num }
---
continue button field: users.revisit
question: |
  Edit users
subquestion: |
  ${ users.table }

  ${ users.add_action() }
---
table: users.table
rows: users
columns:
  - Name: |
      row_item.name.full() if defined("row_item.name.first") else ""
edit:
  - name.first
confirm: True

---
id: download appeals_entry_form
event: appeals_entry_form_download
question: |
  All done
subquestion: |
  Thank you ${users}. Your form is ready to download and deliver.
  
  View, download and send your form below. Click the "Edit answers" button to fix any mistakes.

  ${ action_button_html(url_action('review_appeals_entry_form'), label='Edit answers', color='info') }
  
  
  ${ al_user_bundle.download_list_html() }
  

  ${ al_user_bundle.send_button_html(show_editable_checkbox=True) }

progress: 100
---
# ALDocument objects specify the metadata for each template
objects:
  - appeals_entry_form_attachment: ALDocument.using(title="Civil Appeal Entry Form", filename="appeals_entry_form", enabled=True, has_addendum=False, )
  - appeals_entry_form_Post_interview_instructions: ALDocument.using(title="Instructions", filename="appeals_entry_form_next_steps.docx", enabled=True, has_addendum=False)
---
# Bundles group the ALDocuments into separate downloads, such as for court and for the user
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[appeals_entry_form_attachment, appeals_entry_form_Post_interview_instructions], filename="appeals_entry_form", title="All forms to download for your records", enabled=True)
  - al_court_bundle: ALDocumentBundle.using(elements=[appeals_entry_form_attachment],  filename="appeals_entry_form", title="All forms to deliver to court", enabled=True)
---
# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the same template is 
# used for "preview" and "final" keys, and logic in the template checks the value of 
# `i` to show or hide the user's signature
attachment:
  name: Post-interview-Instructions
  filename: appeals_entry_form_next_steps
  docx template file: appeals_entry_form_next_steps.docx
  variable name: appeals_entry_form_Post_interview_instructions[i]
  skip undefined: True
  tagged pdf: True
---
attachment:
  name: appeals entry form
  filename: appeals_entry_form
  variable name: appeals_entry_form_attachment[i]
  skip undefined: True
  docx template file: appeals_entry_form.docx
  tagged pdf: True
