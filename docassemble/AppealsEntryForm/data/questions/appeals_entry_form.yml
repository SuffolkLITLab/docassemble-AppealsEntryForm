metadata:
  title: >-
     Civil Appeal Entry Form
  short title: >-
    Civil Appeal Entry Form
  description: |-
    This interview helps someone in Massachusetts create a Civil Appeal Entry Form.

    This form is only for civil appeals and is used to docket a civil appeal under Mass. R. A. P. 10(a).
  can_I_use_this_form: |
    You can use this interview if you are filing a civil appeal in Massachusetts and you have received a Notice of Assembly.
  before_you_start: |
    Before you start, gather:

    1. Your Notice of Assembly from the trial court, which should also contain:

    - The name of the trial court you are appealing from
    - Your trial court docket number (from your court paperwork)
    - The case name as it appears on the Notice of Assembly

    After you finish, you will need to:

    1. Submit a PDF of the form on eFileMA.com
    2. Make sure the form and any required fee or fee-waiver motion (with an Affidavit of Indigency) are received **within 14 days** after you get the Notice of Assembly. See Mass. R. A. P. 10(a)(1).
    3. Serve a copy of the form on all other parties.

    Learn more about the appeals process:

    * [Entering the appeal (civil)](https://www.mass.gov/info-details/entering-the-appeal-civil)
    * [Appeals Court frequently asked questions](https://www.mass.gov/guides/appeals-court-frequent-appellate-process-questions)
  when_you_are_finished: |
    Download your Civil Appeal Entry Form and file it on eFileMA.com. 
    Make sure the form and any required fee or fee-waiver motion are received
    within 14 days after you get the Notice of Assembly. Then send a copy to all other parties.
